<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Instant QR Card</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <style>
    body { font-family: system-ui, sans-serif; background: #09090b; color: #fafafa; display: flex; justify-content: center; padding: 40px 20px; margin: 0; }
    .app { width: 100%; max-width: 420px; background: #18181b; padding: 24px; border-radius: 16px; box-shadow: 0 8px 24px rgba(0,0,0,0.4); text-align: center; }
    h1 { font-size: 1.4rem; margin: 0 0 6px; color: #f472b6; }
    p.sub { font-size: 0.85rem; color: #a1a1aa; margin: 0 0 18px; }
    input[type="text"] { width: 100%; box-sizing: border-box; padding: 12px; border-radius: 8px; border: 1px solid #3f3f46; background: #09090b; color: #fff; margin-bottom: 12px; }
    .colors { display: flex; justify-content: space-between; gap: 10px; margin-bottom: 16px; font-size: 0.85rem; color: #d4d4d8; }
    .colors label { flex: 1; background: #09090b; padding: 8px 12px; border-radius: 8px; border: 1px solid #27272a; display: flex; align-items: center; justify-content: space-between; cursor: pointer; }
    input[type="color"] { border: none; background: none; width: 28px; height: 28px; cursor: pointer; }
    #qrBox { background: #ffffff; padding: 16px; border-radius: 12px; display: inline-flex; justify-content: center; align-items: center; margin: 10px 0 18px; min-width: 200px; min-height: 200px; }
    button { width: 100%; background: #f472b6; color: #09090b; border: none; padding: 12px; border-radius: 8px; font-weight: bold; font-size: 0.95rem; cursor: pointer; }
  </style>
</head>
<body>
  <div class="app">
    <h1>Instant QR Card</h1>
    <p class="sub">Generate and download custom QR codes for links, text, or Wi-Fi.</p>

    <input type="text" id="qrText" placeholder="Paste URL or text..." value="https://github.com/simarpreetkaur0208-cmd" oninput="makeQR()" />

    <div class="colors">
      <label>QR Color <input type="color" id="fgColor" value="#09090b" onchange="makeQR()" /></label>
      <label>Background <input type="color" id="bgColor" value="#ffffff" onchange="makeQR()" /></label>
    </div>

    <div id="qrBox"></div>
    <button onclick="downloadQR()">Download PNG</button>
  </div>

  <script>
    function makeQR() {
      const box = document.getElementById('qrBox');
      const text = document.getElementById('qrText').value.trim() || 'https://github.com';
      const fg = document.getElementById('fgColor').value;
      const bg = document.getElementById('bgColor').value;
      box.style.background = bg;
      box.innerHTML = '';
      new QRCode(box, { text, width: 200, height: 200, colorDark: fg, colorLight: bg, correctLevel: QRCode.CorrectLevel.H });
    }

    function downloadQR() {
      const canvas = document.querySelector('#qrBox canvas');
      if (!canvas) return;
      const link = document.createElement('a');
      link.download = 'qr-card.png';
      link.href = canvas.toDataURL('image/png');
      link.click();
    }

    makeQR();
  </script>
</body>
</html>
